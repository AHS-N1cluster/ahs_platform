        var once = null; try { once = sessionStorage.getItem('ahs_sw_reload'); } catch(e){}
        if (!once) { try { sessionStorage.setItem('ahs_sw_reload', '1'); } catch(e){} location.reload(); return; }
      } catch(e){}
    }
    document.open(); document.write(AHSSec.injectHead(html)); document.close();
  }

  function showForm(){
    $('card').style.visibility = 'visible'; $('wait').style.display = 'none'; $('go').disabled = false; $('pw').focus();
  }

  $('f').addEventListener('submit', async function(e){
    e.preventDefault();
    var pw = $('pw').value; if(!pw.trim()) return;
    $('err').style.display = 'none'; $('go').disabled = true; $('wait').style.display = 'block';
    try {
      var r = await AHSSec.unlockRing(RING, pw);
      var mine = r.keys[PAGE_KEY];
      if (!mine) {
        $('err').textContent = Object.keys(r.keys).length ? 'كلمة المرور هذه لا تفتح هذه الصفحة' : 'كلمة المرور غير صحيحة';
        $('err').style.display = 'block'; return showForm();
      }
      await AHSSec.putKeys(r.keys);
      // let the page's own sign-in recognise this person without asking again
      try {
        var slot = mine.slot;
        if (slot === 'owner' || slot === 'manager') localStorage.setItem('n1cluster_gate_v3', r.hash);
        var d = r.keys.dept && r.keys.dept.slot;
        if (d && d !== 'owner' && d !== 'manager') localStorage.setItem('ahs_dept_key', r.hash);
      } catch(e){}
      render(mine);
    } catch(err) {
      $('err').textContent = 'تعذّر فتح المنصة على هذا المتصفح'; $('err').style.display = 'block'; showForm();
    }
  });

  AHSSec.getKey(PAGE_KEY).then(function(rec){ rec ? render(rec) : showForm(); }, showForm);
})();
</script>
</body>
</html>
